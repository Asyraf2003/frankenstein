plugins { id 'com.android.application' }

def engineVersion = rootProject.file('../VERSION').text.trim()
if (!(engineVersion ==~ /(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)/)) throw new GradleException('Invalid engine VERSION')
def versionParts = engineVersion.split('\\.').collect { it.toLong() }
def engineVersionCode = versionParts[0] * 1000000L + versionParts[1] * 1000L + versionParts[2]
if (versionParts[1] > 999 || versionParts[2] > 999 || engineVersionCode < 1 || engineVersionCode > 2100000000L) {
    throw new GradleException('VERSION cannot be represented as an Android versionCode')
}
def signingProof = providers.gradleProperty('signingProof').isPresent()
def isolatedProof = providers.gradleProperty('isolatedProof').isPresent()
// Public OAuth identifiers registered for these package/signing identities.
def googleProduction = '312616303190-b6uef8tbl2bels0h4ful14fc8r2r66lu.apps.googleusercontent.com'
def googleIsolatedProof = '312616303190-ecmdcetvoep27iceg1ib02o914acfhi3.apps.googleusercontent.com'
def googleScheme = { id -> 'com.googleusercontent.apps.' + id.replace('.apps.googleusercontent.com', '') }
def signingInputs = ['KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD'].collectEntries {
    [(it): providers.environmentVariable('ANDROID_RELEASE_' + it).orNull]
}
def signingReady = signingInputs.values().every { it != null && !it.isEmpty() }
def sourceRevision = providers.gradleProperty('engineRevision').orElse(providers.exec {
    commandLine 'git', '-C', rootProject.projectDir.parentFile.absolutePath, 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }).get()
if (!(sourceRevision ==~ /[0-9a-f]{40}/)) throw new GradleException('An exact source revision is required')
android {
    buildFeatures { buildConfig = true }
    namespace 'org.frankenstein.companion'
    compileSdk 35
    defaultConfig {
        applicationId 'org.frankenstein.companion'
        minSdk 29
        targetSdk 35
        versionCode engineVersionCode.toInteger()
        versionName engineVersion
        buildConfigField 'String', 'ENGINE_REVISION', '"' + sourceRevision + '"'
        buildConfigField 'String', 'GOOGLE_DRIVE_CLIENT_ID', '"' + googleProduction + '"'
        testInstrumentationRunner 'org.frankenstein.companion.StorageInstrumentation'
        manifestPlaceholders = [appLabel: 'Frankenstein (development)', googleOAuthScheme: googleScheme(googleProduction)]
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        main.jniLibs.srcDir layout.buildDirectory.dir('generated/native/jniLibs')
        main.assets.srcDir layout.buildDirectory.dir('generated/native/assets')
        androidTest.assets.srcDir layout.buildDirectory.dir('generated/test-fixtures')
        release.assets.srcDir layout.buildDirectory.dir('generated/release/assets')
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    signingConfigs { maintainer {
        if (signingReady) {
            storeFile file(signingInputs.KEYSTORE)
            storePassword signingInputs.STORE_PASSWORD
            keyAlias signingInputs.KEY_ALIAS
            keyPassword signingInputs.KEY_PASSWORD
        }
    } }
    buildTypes {
        debug {
            applicationIdSuffix isolatedProof ? '.dev.proof' : '.dev'
            versionNameSuffix '-dev'
            buildConfigField 'String', 'GOOGLE_DRIVE_CLIENT_ID', '"' + (isolatedProof ? googleIsolatedProof : '') + '"'
            manifestPlaceholders = [appLabel: isolatedProof ? 'Frankenstein (isolated test)' : 'Frankenstein (development)',
                googleOAuthScheme: isolatedProof ? googleScheme(googleIsolatedProof) : 'org.frankenstein.companion.dev.oauth-disabled']
        }
        release {
            debuggable false
            signingConfig signingConfigs.maintainer
            manifestPlaceholders = [appLabel: signingProof ? 'Frankenstein (signing test)' : 'Frankenstein']
            if (signingProof) {
                applicationIdSuffix '.dev.releaseproof'
                versionNameSuffix '-signing-test'
                buildConfigField 'String', 'GOOGLE_DRIVE_CLIENT_ID', '""'
                manifestPlaceholders.googleOAuthScheme = 'org.frankenstein.companion.dev.releaseproof.oauth-disabled'
            }
        }
    }
}
tasks.register('prepareReleaseIdentity') {
    doLast {
        if (!signingReady) throw new GradleException('Explicit Android release signing inputs are required')
        if (!signingProof && providers.environmentVariable('FRANKENSTEIN_RELEASE_AUTHORIZED').orNull != engineVersion) {
            throw new GradleException('Production signing requires explicit authorization for VERSION')
        }
        def signer = providers.environmentVariable('ANDROID_RELEASE_SIGNER_SHA256').orNull
        if (signer == null || !(signer ==~ /[0-9a-fA-F]{64}/)) throw new GradleException('A pinned release signer SHA256 is required')
        def metadata = [schema: 1, version: engineVersion, version_code: engineVersionCode,
                        commit: sourceRevision, channel: signingProof ? 'signing-test' : 'stable',
                        application_id: 'org.frankenstein.companion' + (signingProof ? '.dev.releaseproof' : '')]
        def output = layout.buildDirectory.file('generated/release/assets/engine.json').get().asFile
        output.parentFile.mkdirs()
        output.text = groovy.json.JsonOutput.toJson(metadata) + '\n'
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach { dependsOn 'prepareReleaseIdentity' }
tasks.register('requireNativeVault') {
    doLast {
        if (!layout.buildDirectory.file('generated/native/jniLibs/arm64-v8a/libfrankenstein_vault.so').get().asFile.exists()) {
            throw new GradleException('Run android/build-native.sh with the Android NDK before building the companion.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'requireNativeVault' }
dependencies {
    implementation 'com.google.crypto.tink:tink-android:1.24.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
