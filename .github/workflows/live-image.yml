name: Experimental live image
on:
  pull_request:
    paths:
      - 'installer/**'
      - 'packaging/**'
      - 'lib/**'
      - 'vault/**'
      - 'transport/**'
      - 'tests/test_installer.py'
      - 'tests/live-vm.py'
      - 'tests/provisioning-fixture.py'
      - '.github/workflows/live-image.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build Arch ISO and run package tests
        run: |
          mkdir -p "$RUNNER_TEMP/frankenstein"
          docker run --rm --privileged \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/frankenstein,dst=/artifacts" \
            archlinux:base bash -euc '
              pacman -Syu --needed --noconfirm archiso base-devel python
              bash /source/installer/build-iso.sh /artifacts/build
            '
      - name: Install and boot a disposable 4 GiB VM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf python3-pexpect age
          python3 tests/live-vm.py --iso "$(find "$RUNNER_TEMP/frankenstein/build/out" -name '*.iso' -print -quit)" --state "$RUNNER_TEMP/vm-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disposable-vm-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vm-proof/*.log
            ${{ runner.temp }}/vm-proof/*.json
            ${{ runner.temp }}/vm-proof/*.ppm
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: frankenstein-experimental-${{ github.sha }}
          path: |
            ${{ runner.temp }}/frankenstein/build/out/*.iso
            ${{ runner.temp }}/frankenstein/build/out/SHA256SUMS
          retention-days: 7
          if-no-files-found: error
