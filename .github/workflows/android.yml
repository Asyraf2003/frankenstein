name: Android companion
on:
  pull_request:
    paths: ['android/**', 'transport/**', 'vault/**', 'tests/test_usb.py', 'tests/native-portable.py', '.github/workflows/android.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: vault/native/go.sum
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: go -C vault/native build -buildvcs=false -o out/bridge .
      - run: python3 tests/native-portable.py
      - run: sdkmanager 'ndk;28.2.13676358'
      - run: bash android/build-native.sh
      - run: bash android/gradlew -p android --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - run: python3 -m unittest discover -s tests -p test_usb.py -v
      - uses: actions/upload-artifact@v4
        with:
          name: frankenstein-companion-development-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
