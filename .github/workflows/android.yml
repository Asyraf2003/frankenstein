name: Android companion
on:
  pull_request:
    paths: ['VERSION', 'android/**', 'transport/**', 'vault/**', 'lib/provision.py', 'lib/device_sync.py', 'installer/install.py', 'tests/test_usb.py', 'tests/test_android_release.py', 'tests/native-portable.py', 'tests/native-device-sync.py', 'tests/provisioning-fixture.py', '.github/workflows/android.yml']
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.0'
          cache-dependency-path: vault/native/go.sum
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: go -C vault/native build -buildvcs=false -o out/bridge .
      - run: python3 tests/native-portable.py
      - run: python3 tests/native-device-sync.py
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "build-tools;35.0.0" "platforms;android-35"'
      - run: bash android/build-native.sh
      - run: bash android/gradlew -p android --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - run: python3 -m unittest discover -s tests -p test_usb.py -v
      - run: python3 -m unittest discover -s tests -p test_android_release.py -v
      - name: Verify isolated release signing with a disposable key
        run: bash android/signing-proof.sh
      - uses: actions/upload-artifact@v4
        with:
          name: frankenstein-companion-development-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
